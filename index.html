<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <title>App Lista de Supermercado</title>
  </head>
  <body>
    <header>
      <h2>App Cadastro de Produtos</h2>
    </header>
    <div class="lista-cadastro">
      <input
        type="text"
        name="nome_produto"
        placeholder="nome do produto..."
        id=""
      />
      <input type="number" name="price" step="0.01" id="" />
      <input type="submit" name="acao" value="Cadastrar" />
    </div>
    <!--lista-cadastro-->

    <div class="lista-produtos"></div>
    <!--lista-produtos-->

    <div class="soma-produto">
      <h1>Total R$0,00</h1>
    </div>
    <!--soma-produto-->

    <button name="limpar">Limpar</button>

    <script src="./src/js/script.js"></script>
  </body>
</html>
